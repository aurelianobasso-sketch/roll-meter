<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roll Meter">
<link rel="manifest" href="manifest.json">
<title>Roll Meter Calculator</title>
<style>
:root{
  --bg:#0f172a;
  --card:#111827;
  --text:#f8fafc;
  --muted:#94a3b8;
  --accent:#22c55e;
  --field:#1f2937;
  --border:#334155;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,#0f172a,#111827);
  color:var(--text);
  min-height:100vh;
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
}
.wrap{max-width:520px;margin:0 auto}
h1{font-size:30px;margin:6px 0 6px}
.sub{color:var(--muted);margin-bottom:20px;line-height:1.35}
.card{
  background:rgba(17,24,39,.96);
  border:1px solid var(--border);
  border-radius:20px;
  padding:18px;
  box-shadow:0 18px 50px rgba(0,0,0,.28);
}
.grid{display:grid;gap:14px}
label{font-size:14px;color:#cbd5e1}
.row{display:grid;grid-template-columns:1fr 112px;gap:10px}
input,select{
  width:100%;
  margin-top:6px;
  padding:14px 13px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--field);
  color:var(--text);
  font-size:18px;
  outline:none;
}
input:focus,select:focus{border-color:var(--accent)}
button{
  width:100%;
  margin-top:18px;
  padding:15px;
  border:0;
  border-radius:14px;
  background:var(--accent);
  color:#052e16;
  font-weight:800;
  font-size:18px;
}
.results{
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid var(--border);
}
.big{font-size:38px;font-weight:800;letter-spacing:-1px}
.green{color:#4ade80}
.small{color:var(--muted);font-size:14px;margin-top:4px}
.error{color:#fca5a5;margin-top:12px;display:none}
.formula{
  margin-top:18px;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}
.preset{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}
.preset button{
  width:auto;
  margin:0;
  padding:9px 12px;
  font-size:14px;
  background:#1e293b;
  color:#e2e8f0;
  border:1px solid var(--border);
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Roll Meter</h1>
  <div class="sub">Estimate the material remaining on a roll from its diameters.</div>

  <div class="card">
    <div class="preset">
      <button type="button" onclick="loadExample()">Load your roll</button>
      <button type="button" onclick="clearAll()">Clear</button>
    </div>

    <div class="grid">
      <label>Core diameter
        <div class="row">
          <input id="core" inputmode="decimal" placeholder="3.5">
          <select id="diamUnit1">
            <option value="in">in</option>
            <option value="mm">mm</option>
            <option value="cm">cm</option>
          </select>
        </div>
      </label>

      <label>Current roll diameter
        <div class="row">
          <input id="current" inputmode="decimal" placeholder="5.875">
          <select id="diamUnit2">
            <option value="in">in</option>
            <option value="mm">mm</option>
            <option value="cm">cm</option>
          </select>
        </div>
      </label>

      <label>Full roll diameter
        <div class="row">
          <input id="full" inputmode="decimal" placeholder="15.875">
          <select id="diamUnit3">
            <option value="in">in</option>
            <option value="mm">mm</option>
            <option value="cm">cm</option>
          </select>
        </div>
      </label>

     <label>Original roll length
      <select id="length">
        <option value="310">310 m</option>
        <option value="620" selected>620 m</option>
      </select>
     </label> 
    </div>

    <button onclick="calculate()">Calculate remaining</button>

    <div id="error" class="error"></div>

    <div class="results">
      <div class="small">Estimated remaining</div>
      <div id="remaining" class="big green">—</div>
      <div id="percent" class="small">—</div>
      <div id="used" class="small">—</div>
    </div>

    <div class="formula">
      Assumes uniform material thickness and reasonably consistent winding density.
      Formula: (current² − core²) ÷ (full² − core²).
    </div>
  </div>
</div>

<script>
function toInches(v,u){
  if(u==="in") return v;
  if(u==="mm") return v/25.4;
  if(u==="cm") return v/2.54;
}
function fmt(n){ return n.toLocaleString(undefined,{maximumFractionDigits:1}); }

function calculate(){
  const c = parseFloat(document.getElementById('core').value);
  const d = parseFloat(document.getElementById('current').value);
  const f = parseFloat(document.getElementById('full').value);
  const L = parseFloat(document.getElementById('length').value);

  const err = document.getElementById('error');
  err.style.display="none";

  if([c,d,f,L].some(x=>!isFinite(x) || x<=0)){
    err.textContent="Enter positive numbers in all four fields.";
    err.style.display="block";
    return;
  }

  const ci = toInches(c,document.getElementById('diamUnit1').value);
  const di = toInches(d,document.getElementById('diamUnit2').value);
  const fi = toInches(f,document.getElementById('diamUnit3').value);

  if(di < ci || fi <= ci || di > fi){
    err.textContent="Current diameter must be between the core diameter and full-roll diameter.";
    err.style.display="block";
    return;
  }

  const fraction = (di*di-ci*ci)/(fi*fi-ci*ci);
  const remaining = L*fraction;
  const unit = "m";

  document.getElementById('remaining').textContent = fmt(remaining)+" "+unit;
  document.getElementById('percent').textContent = fmt(fraction*100)+"% remaining";
  document.getElementById('used').textContent = fmt(L-remaining)+" "+unit+" used";

  localStorage.setItem("rollmeter", JSON.stringify({
  c,d,f,L,
  du1:diamUnit1.value,
  du2:diamUnit2.value,
  du3:diamUnit3.value
}));
}

function loadExample(){
  core.value="3.5";
  current.value="5.875";
  full.value="15.875";
  length.value="620";
  diamUnit1.value=diamUnit2.value=diamUnit3.value="in";
  calculate();
}
function clearAll(){
  [core,current,full,length].forEach(x=>x.value="");
  remaining.textContent="—"; percent.textContent="—"; used.textContent="—";
  localStorage.removeItem("rollmeter");
}
window.addEventListener("load",()=>{
  try{
    const x=JSON.parse(localStorage.getItem("rollmeter"));
    if(x){
  core.value=x.c;
  current.value=x.d;
  full.value=x.f;
  length.value=x.L;

  diamUnit1.value=x.du1;
  diamUnit2.value=x.du2;
  diamUnit3.value=x.du3;

  calculate();
} else loadExample();
  }catch(e){ loadExample(); }

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
});
</script>
</body>
</html>
